framework: "net10.0"
owner: "saffsd"
overview: "Cast to Google Cast devices from Jellyfin's built-in cast interface, on every client including iOS/iPadOS/macOS."
description: >
  Discovers Google Cast (Chromecast) devices on the local network and exposes each one as a
  session in Jellyfin's existing "Play On" / cast interface. Casting is handed off to Jellyfin's
  own cast receiver app - the same one Chrome users already use - so transcoding, subtitle
  handling and codec negotiation (including transcoding H.265/HEVC sources that older Chromecast
  hardware can't decode) work the same way they already do for Chrome/Android users, but from any
  Jellyfin client, including the iOS/iPadOS/macOS apps that have no Google Cast SDK of their own.
category: "General"
artifacts:
- "Jellyfin.Plugin.Chromecast.dll"
changelog: >
  0.1.6.4: saffsd fork. Picking Disconnect no longer leaves the TV sitting on the Jellyfin "ready to cast" screen. The plugin stops playback and then closes the receiver once the client has stayed away for ten seconds; closing it the instant the client disconnects put the TV back on the ready screen when the user was only picking a different video. Built for Jellyfin 12.0.

  0.1.6.3: saffsd fork. Switching to a different video while one is already casting no longer knocks the TV back to the ready screen a few seconds in. Three separate faults in how the Chromecast's own status reports were read, each of which made Jellyfin think nothing was playing and put the ready screen up over the top of live playback. Built for Jellyfin 12.0.

  0.1.6.2: saffsd fork. A cast left running to the end of a clip no longer leaves the session stuck: the server used to keep showing it as playing (and streaming to the TV) after the TV had already stopped, until you stopped it by hand or restarted. Built for Jellyfin 12.0.

  0.1.6.1: saffsd fork. Fixes two faults found casting to real hardware: an async void heartbeat failure that could terminate the whole Jellyfin process, and Dolby (AC-3/E-AC-3) audio that stopped at 0 ms because it was stream-copied into HLS. Built for Jellyfin 12.0.

  0.1.6.0: A Chromecast that is switched off or unplugged is now noticed within seconds: the settings page shows its real status and it leaves the cast menu, also when it has a custom name. The ready screen appears again on the first connect after a Chromecast restarted. The TV goes back to the ready screen 30 seconds after showing a movie's details instead of staying on them. A video you move from the app's player to the Chromecast keeps playing when you close the player. Every command to a Chromecast now has a time limit, so a device that stops answering can no longer leave the app waiting. New setting: skip the Chromecast's network speed test for a faster start on fast, steady networks (off by default). Works on Jellyfin 12.0, 12.1 and 12.2.

  0.1.5.0: Chromecasts no longer disappear from the cast menu for minutes at a time: a device is only removed when it really can't be reached. Switching quickly between videos now always ends on the last one you picked. 'Play from here' in a list starts at the item you chose instead of the first. Each cast now uses one Jellyfin session for the casting user instead of two, so per-user session limits are reached half as fast. Works on Jellyfin 12.0, 12.1 and 12.2.

  0.1.4.0: The TV now follows what you do in the app: connecting shows Jellyfin's ready screen (on the Chromecast you used last), opening a movie shows it on the TV, Stop goes back to the ready screen, and Disconnect closes Jellyfin on the TV. If a cast can't start, the app tells you why. The settings page works now (it never loaded or saved before) and lists your Chromecasts with their status, a Test button, and options to rename or hide each one. Routine discovery lines are gone from the server log unless Verbose logging is on. Works on Jellyfin 12.0, 12.1 and 12.2. Note: each cast uses up to 2 extra sessions for the casting user, so a per-user session limit must leave room for that.

  0.1.3.0: Subtitles now work, including external .srt files: the subtitle selector no longer
  disappears when connected to a Chromecast, and the chosen track is actually used. The unstable
  receiver is now the default (the stable one can't load external subtitle files yet) - existing
  installs that saved this setting keep their choice. Playback starts in about a second when the
  item page was opened while connected (the receiver now starts early and stays running between
  casts), and the Jellyfin screen on the TV closes after Stop or after 3 minutes idle.

  0.1.2.0: Fixes switching subtitle or audio tracks mid-cast from the remote-control UI, which was
  previously a silent no-op. Also fixes a release-versioning bug that could leave an update stuck
  showing the old version as active with Disable/Uninstall failing - 0.1.1.0 is pulled from this
  repository for that reason, please install 0.1.2.0 directly.

  0.1.0.0: First public test release. Confirmed working against real Chromecast hardware and the
  iOS/macOS apps: discovery, casting, H.265/HEVC transcoding, play/pause/unpause/stop/seek/skip/
  volume/mute, queueing and queue navigation, live playback state in the remote control screen,
  picking up an in-progress cast from a second device, and access token cleanup on stop.
